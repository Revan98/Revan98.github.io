<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel Merge Tool</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"/>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/merge.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="nav-container">
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <i class="fa-solid fa-bars icon-menu" style="font-size: 20px"></i>
          <i class="fa-solid fa-xmark icon-close" style="font-size: 20px"></i>
        </button>

        <div class="nav-links" id="nav-links">
          <a href="index.html">KD Select</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="playercard.html">Player Card</a>
          <a href="compare.html">Compare</a>
          <a href="dkp.html">DKP Calculator</a>
          <a href="merge.html" class="active">Merge</a>
          <a href="equipment.html">Equipment Editor</a>
          <a href="map.html">Aoo planner</a>
          <a href="dbexplorer.html">DB Explorer</a>
        </div>

        <label class="theme-toggle">
          <i class="fa-solid fa-sun" style="font-size: 16px"></i>
          <input type="checkbox" id="toggle-theme" />
          <span class="toggle-slider"></span>
          <i class="fa-solid fa-moon" style="font-size: 16px"></i>
        </label>
      </div>
    </header>

    <main class="page-main">
      <div class="container">
        <section class="card">
          <div class="put-in-row">
            <label>File 1 (Base):</label>
            <input type="file" id="file1" class="file" accept=".xlsx" />
          </div>

          <div class="put-in-row">
            <label>File 2 (Merge Source):</label>
            <input type="file" id="file2" class="file" accept=".xlsx" />
          </div>

          <div id="columnSelectors" style="display: none">
            <div class="put-in-row">
              <label for="idColumn">Select File 1 ID column:</label>
              <select id="idColumn" class="file"></select>
            </div>

            <div class="put-in-row">
              <label for="sourceIdColumn">Select File 2 ID column:</label>
              <select id="sourceIdColumn" class="file"></select>
            </div>

            <div class="put-in-row">
              <label for="mergeColumn"
                >Select column to merge from File 2:</label
              >
              <select id="mergeColumn" class="file"></select>
            </div>
          </div>

          <div class="put-in-row">
            <button id="mergeBtn" class="primary" disabled>Merge</button>
            <progress id="progress" max="100" value="0"></progress>
          </div>

          <div class="put-in-row">
            <button id="export-xlsx" class="primary">Export XLSX</button>
            <button id="export-csv" class="primary">Export CSV</button>
            <button id="export-json" class="primary">Export JSON</button>
          </div>

          <div id="merge-results-info">No merged data yet.</div>
          <div id="myGrid" class="ag-theme-quartz" style="height: 500px"></div>
        </section>
      </div>
    </main>

    <footer>
      <div class="footer-bottom">
        <span>Merge</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.1.0/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="js/merge.js"></script>
  </body>
</html>
